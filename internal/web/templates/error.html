<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<meta name="theme-color" content="#F8FAFC">
<title>{{.Title}} · CodeBuddy Gate</title>
<style>{{template "styles"}}</style>
<style>
  .shell { display: grid; place-items: center; min-height: 100vh; }
  .error-card { width: 100%; max-width: 440px; padding: clamp(24px, 6vw, 32px); text-align: center; }
  .error-icon {
    display: grid; place-items: center; width: 48px; height: 48px; margin: 0 auto 16px;
    border-radius: 14px; background: var(--danger-soft); color: var(--danger);
  }
  .error-card h1 { margin: 0 0 8px; font-size: 19px; font-weight: 650; }
  .error-card p { margin: 0 0 8px; color: var(--text-muted); font-size: 14px; }
  .error-card .hint {
    display: block; margin: 12px 0 20px; padding: 10px 12px;
    background: var(--surface-2); border-radius: var(--radius-sm);
    color: var(--text-muted); font-family: var(--mono); font-size: 13px;
    text-align: left; word-break: break-all;
  }
  .error-card .btn { min-height: 44px; }
</style>
</head>
<body>
<div class="shell">
  <section class="card error-card">
    <span class="error-icon" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle><path d="M12 8v4"></path><path d="M12 16h.01"></path>
      </svg>
    </span>
    <h1>{{.Title}}</h1>
    <p>{{.Message}}</p>
    {{if .Hint}}<code class="hint">{{.Hint}}</code>{{end}}
    <a class="btn btn--primary" href="/list">返回会话列表</a>
  </section>
</div>
</body>
</html>
